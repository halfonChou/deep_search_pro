[project]
name = "deep-search-pro"
version = "0.1.0"
requires-python = ">=3.11"

# ---- ruff 配置 ----
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes（未使用变量/导入等）
    "I",   # isort（import 排序）
    "UP",  # pyupgrade（旧语法升级提示）
    "B",   # flake8-bugbear（常见 bug 模式）
]
ignore = [
    "E501",  # 行过长（已有 line-length 兜底，docstring 等场景放宽）
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---- pytest 配置 ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
